<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Football Capital | Investment Sim</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800;900&display=swap');
        
        :root {
            --bg: #020617;
            --card: rgba(30, 41, 59, 0.5);
            --accent: #3b82f6;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg); 
            color: #f8fafc;
            margin: 0;
            padding: 0;
            overscroll-behavior: none; /* Prevents "bounce" on mobile */
        }

        /* Fixed the Scrolling Issue */
        .game-viewport {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 120px; /* Space for the bottom bar */
        }

        .glass { 
            background: rgba(15, 23, 42, 0.8); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255,255,255,0.1); 
        }

        .bet-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4), rgba(15, 23, 42, 0.4));
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.1s ease;
        }

        .active-bet {
            border-color: var(--accent) !important;
            background: rgba(59, 130, 246, 0.1) !important;
        }

        /* Result Modal Styling */
        #result-modal {
            backdrop-filter: blur(20px);
            background: rgba(2, 6, 23, 0.9);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        input[type="number"] { -moz-appearance: textfield; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>

    <div id="lobby" class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-[#020617]">
        <div class="w-full max-w-sm glass rounded-[2.5rem] p-8 text-center shadow-2xl">
            <h1 class="text-4xl font-black tracking-tighter mb-2">FOOTBALL<br><span class="text-blue-500">CAPITAL</span></h1>
            <p class="text-slate-500 text-[10px] tracking-[0.3em] uppercase mb-10 font-bold italic">Global Investment Firm</p>
            
            <div id="connection-ui" class="space-y-4">
                <button onclick="initializeHost()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-black text-sm tracking-widest transition-all active:scale-95 shadow-xl shadow-blue-900/40">HOST NEW FIRM</button>
                <div class="flex items-center gap-3 py-2 text-slate-700">
                    <div class="h-px bg-slate-800 flex-grow"></div>
                    <span class="text-[10px] font-black uppercase">OR JOIN COMPETITOR</span>
                    <div class="h-px bg-slate-800 flex-grow"></div>
                </div>
                <input type="number" id="joinId" inputmode="numeric" placeholder="Enter PIN" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center text-3xl font-black tracking-[0.4em] focus:border-blue-500 outline-none text-white">
                <button onclick="joinGame()" class="w-full bg-slate-800 py-4 rounded-2xl font-black text-sm tracking-widest transition-all active:scale-95">JOIN ROOM</button>
            </div>
            <div id="status" class="mt-8 text-blue-400 font-mono text-xs font-bold animate-pulse"></div>
        </div>
    </div>

    <div id="game-container" class="hidden game-viewport">
        
        <div class="glass border-b border-white/10 p-4 flex justify-between items-center z-20">
            <div class="w-1/3">
                <p class="text-[9px] uppercase font-black text-slate-500 tracking-wider">Capital Value</p>
                <h2 id="balance" class="text-xl font-black text-emerald-400">$1,000,000</h2>
            </div>
            <div class="flex flex-col items-center w-1/3">
                <div id="round-timer" class="text-3xl font-black tabular-nums tracking-tighter">90</div>
                <div class="text-[8px] font-black uppercase text-blue-500 tracking-tighter">Market Open</div>
            </div>
            <div class="w-1/3 text-right">
                <p class="text-[9px] uppercase font-black text-slate-500 tracking-wider">Period <span id="round-num">1</span>/12</p>
                <h2 id="opp-balance" class="text-xl font-black text-slate-500">$1.0M</h2>
            </div>
        </div>

        <div class="flex overflow-x-auto bg-slate-900/30 px-4 py-3 gap-2 no-scrollbar shrink-0 border-b border-white/5">
            <button onclick="filterLeague('All', this)" class="league-btn px-5 py-2 rounded-xl text-[10px] font-black whitespace-nowrap bg-blue-600 uppercase tracking-widest">Global</button>
            <button onclick="filterLeague('Premier League', this)" class="league-btn px-5 py-2 rounded-xl text-[10px] font-black whitespace-nowrap bg-slate-800 text-slate-500 uppercase tracking-widest">England</button>
            <button onclick="filterLeague('La Liga', this)" class="league-btn px-5 py-2 rounded-xl text-[10px] font-black whitespace-nowrap bg-slate-800 text-slate-500 uppercase tracking-widest">Spain</button>
            <button onclick="filterLeague('Champions League', this)" class="league-btn px-5 py-2 rounded-xl text-[10px] font-black whitespace-nowrap bg-slate-800 text-slate-500 uppercase tracking-widest">UCL</button>
        </div>

        <div id="fixtures-list" class="scroll-area p-4 space-y-4">
            </div>

        <div class="fixed bottom-0 left-0 right-0 glass border-t border-white/10 p-5 z-30 shadow-2xl">
            <div class="flex items-center justify-between gap-4 max-w-xl mx-auto">
                <div class="shrink-0">
                    <div id="active-count" class="text-[9px] font-black text-slate-500 uppercase tracking-tighter mb-1">0 Markets Open</div>
                    <div id="total-stake-display" class="text-lg font-black text-white">$0</div>
                </div>
                <button id="lock-bets-btn" onclick="submitBets()" class="flex-grow bg-blue-600 py-4 rounded-2xl font-black uppercase tracking-[0.1em] text-xs shadow-xl shadow-blue-900/30 active:scale-95 transition-all">
                    COMMIT INVESTMENTS
                </button>
            </div>
        </div>
    </div>

    <div id="result-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-6">
        <div class="w-full max-w-sm glass rounded-[3rem] p-8 text-center border-white/20 border shadow-2xl">
            <div class="mb-6">
                <p id="modal-round-text" class="text-blue-500 text-[10px] font-black uppercase tracking-[0.3em] mb-2">Month 1 Settlement</p>
                <div id="modal-pnl" class="text-5xl font-black tracking-tighter">+$0</div>
            </div>

            <div id="modal-logs" class="space-y-2 mb-8 max-h-48 overflow-y-auto no-scrollbar">
                </div>

            <button onclick="closeModal()" class="w-full bg-white text-black py-4 rounded-2xl font-black uppercase tracking-widest text-[10px] active:scale-95 transition-transform">Next Fiscal Month</button>
        </div>
    </div>

    <script>
        const CLUBS = {
            "Premier League": ["Man City", "Arsenal", "Liverpool", "Chelsea", "Man Utd", "Tottenham", "Newcastle", "Aston Villa"],
            "La Liga": ["Real Madrid", "Barcelona", "Atletico Madrid", "Girona", "Real Sociedad", "Sevilla"],
            "Bundesliga": ["Leverkusen", "Bayern Munich", "Dortmund", "Leipzig", "Stuttgart"],
            "Serie A": ["Inter Milan", "AC Milan", "Juventus", "Atalanta", "Napoli"],
            "Champions League": ["Real Madrid", "Man City", "Bayern Munich", "Inter Milan", "PSG", "Arsenal"]
        };

        const ID_PREFIX = "FC-26-";
        let peer, conn, myBalance = 1000000, oppBalance = 1000000, isHost = false;
        let round = 1, timeLeft = 90, myBets = {}, currentFixtures = [], timerInterval;
        let hostReady = false, joinerReady = false;

        // Visual Helper: Generates a high-quality Initial-based logo with consistent colors
        function getLogoURL(name) {
            const colors = ['3b82f6', 'ef4444', '10b981', 'f59e0b', '8b5cf6', 'ec4899'];
            const charCode = name.charCodeAt(0);
            const color = colors[charCode % colors.length];
            return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=${color}&color=fff&bold=true&rounded=true&format=svg`;
        }

        function initializeHost() {
            const pin = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(ID_PREFIX + pin);
            peer.on('open', () => {
                document.getElementById('status').innerHTML = `FIRM PIN: <span class="text-white text-3xl block mt-1 font-black tracking-widest">${pin}</span>`;
                isHost = true;
            });
            peer.on('connection', (c) => { conn = c; setupConnection(); });
        }

        function joinGame() {
            const pin = document.getElementById('joinId').value;
            if (pin.length !== 4) return;
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(ID_PREFIX + pin);
                setupConnection();
            });
            peer.on('error', () => alert("Room Not Found"));
        }

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('lobby').classList.add('hidden');
                document.getElementById('game-container').classList.remove('hidden');
                if (isHost) startRound();
            });
            conn.on('data', (data) => {
                if (data.type === 'SYNC') {
                    currentFixtures = data.fixtures;
                    round = data.round;
                    timeLeft = data.timeLeft;
                    resetRound();
                }
                if (data.type === 'RESULTS') processResults(data.results);
                if (data.type === 'READY') {
                    joinerReady = true;
                    if (hostReady) simulateRound();
                }
                if (data.type === 'BAL') {
                    oppBalance = data.bal;
                    updateHeader();
                }
            });
        }

        function startRound() {
            hostReady = false; joinerReady = false;
            currentFixtures = [];
            Object.keys(CLUBS).forEach(league => {
                const teams = CLUBS[league];
                for(let i=0; i<2; i++) {
                    const h = teams[Math.floor(Math.random()*teams.length)];
                    let a = teams[Math.floor(Math.random()*teams.length)];
                    while(a === h) a = teams[Math.floor(Math.random()*teams.length)];
                    const s1 = Math.random() + 0.5, s2 = Math.random() + 0.5;
                    currentFixtures.push({
                        id: Math.random().toString(36).substr(2, 5),
                        league, h, a,
                        oh: (1/(s1/(s1+s2)) + 0.1).toFixed(2),
                        oa: (1/(s2/(s1+s2)) + 0.1).toFixed(2),
                        s1, s2
                    });
                }
            });
            timeLeft = 90;
            conn.send({ type: 'SYNC', fixtures: currentFixtures, round, timeLeft });
            resetRound();
        }

        function resetRound() {
            myBets = {};
            clearInterval(timerInterval);
            document.getElementById('fixtures-list').scrollTop = 0;
            document.getElementById('lock-bets-btn').disabled = false;
            document.getElementById('lock-bets-btn').innerText = "COMMIT INVESTMENTS";
            document.getElementById('lock-bets-btn').classList.replace('bg-slate-700', 'bg-blue-600');
            renderFixtures('All');
            updateHeader();
            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('round-timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (isHost) simulateRound();
                }
            }, 1000);
        }

        function renderFixtures(filter) {
            const list = document.getElementById('fixtures-list');
            list.innerHTML = '';
            currentFixtures.filter(f => filter === 'All' || f.league === filter).forEach(f => {
                const card = document.createElement('div');
                card.className = `p-5 rounded-3xl bet-card flex flex-col gap-4`;
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-[8px] font-black uppercase text-blue-500 tracking-widest">${f.league}</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="text-center w-24">
                            <img src="${getLogoURL(f.h)}" class="w-12 h-12 mx-auto mb-2 shadow-lg">
                            <div class="text-[10px] font-black uppercase truncate">${f.h}</div>
                        </div>
                        <div class="text-[10px] font-black text-slate-700 italic">VS</div>
                        <div class="text-center w-24">
                            <img src="${getLogoURL(f.a)}" class="w-12 h-12 mx-auto mb-2 shadow-lg">
                            <div class="text-[10px] font-black uppercase truncate">${f.a}</div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="pick('${f.id}','h')" id="b-${f.id}-h" class="bg-slate-900 border border-slate-800 py-3 rounded-2xl text-[10px] font-black transition-all">BUY ${f.oh}x</button>
                        <button onclick="pick('${f.id}','a')" id="b-${f.id}-a" class="bg-slate-900 border border-slate-800 py-3 rounded-2xl text-[10px] font-black transition-all">BUY ${f.oa}x</button>
                    </div>
                    <input type="number" inputmode="numeric" placeholder="INVESTMENT AMOUNT" oninput="stake('${f.id}', this.value)" 
                        class="w-full bg-black/40 border border-white/5 py-3 rounded-2xl text-center text-[10px] font-black text-emerald-400 outline-none focus:border-blue-500">
                `;
                list.appendChild(card);
            });
            updateSummary();
        }

        function pick(id, side) {
            if (!myBets[id]) myBets[id] = { stake: 0 };
            myBets[id].side = side;
            document.querySelectorAll(`[id^="b-${id}-"]`).forEach(b => b.classList.remove('bg-blue-600', 'border-blue-400'));
            document.getElementById(`b-${id}-${side}`).classList.add('bg-blue-600', 'border-blue-400');
            updateSummary();
        }

        function stake(id, val) {
            if (!myBets[id]) myBets[id] = { side: 'h' };
            myBets[id].stake = Math.abs(parseInt(val)) || 0;
            updateSummary();
        }

        function updateSummary() {
            const bets = Object.values(myBets).filter(b => b.stake > 0);
            const total = bets.reduce((a, b) => a + b.stake, 0);
            document.getElementById('active-count').innerText = `${bets.length} MARKETS COMMITTED`;
            document.getElementById('total-stake-display').innerText = `$${total.toLocaleString()}`;
        }

        function submitBets() {
            const total = Object.values(myBets).reduce((a, b) => a + b.stake, 0);
            if (total > myBalance) return alert("Insufficient Capital!");
            
            const btn = document.getElementById('lock-bets-btn');
            btn.disabled = true;
            btn.innerText = "WAITING FOR MARKET DATA...";
            btn.classList.replace('bg-blue-600', 'bg-slate-700');

            if (isHost) {
                hostReady = true;
                if (joinerReady) simulateRound();
            } else {
                conn.send({ type: 'READY' });
            }
        }

        function simulateRound() {
            if (!isHost) return;
            const results = currentFixtures.map(f => ({
                id: f.id, winner: (Math.random()*(f.s1+f.s2)) < f.s1 ? 'h' : 'a'
            }));
            conn.send({ type: 'RESULTS', results });
            processResults(results);
        }

        function processResults(results) {
            let pnl = 0, logs = [];
            results.forEach(res => {
                const bet = myBets[res.id];
                const fix = currentFixtures.find(f => f.id === res.id);
                if (bet && bet.stake > 0) {
                    if (bet.side === res.winner) {
                        const win = bet.stake * (res.winner === 'h' ? fix.oh : fix.oa);
                        pnl += (win - bet.stake);
                        logs.push(`<div class="flex justify-between text-[10px] font-black uppercase text-emerald-400"><span>${fix.h} Profit</span> <span>+$${Math.floor(win).toLocaleString()}</span></div>`);
                    } else {
                        pnl -= bet.stake;
                        logs.push(`<div class="flex justify-between text-[10px] font-black uppercase text-rose-500"><span>${fix.h} Loss</span> <span>-$${bet.stake.toLocaleString()}</span></div>`);
                    }
                }
            });
            myBalance += pnl;
            showResults(pnl, logs);
            conn.send({ type: 'BAL', bal: myBalance });
        }

        function showResults(pnl, logs) {
            const modal = document.getElementById('result-modal');
            const pnlEl = document.getElementById('modal-pnl');
            pnlEl.innerText = (pnl >= 0 ? "+$" : "-$") + Math.abs(Math.floor(pnl)).toLocaleString();
            pnlEl.className = pnl >= 0 ? "text-5xl font-black tracking-tighter text-emerald-400" : "text-5xl font-black tracking-tighter text-rose-500";
            document.getElementById('modal-logs').innerHTML = logs.length ? logs.join('') : '<p class="text-slate-600 font-black uppercase text-[10px]">No investments made</p>';
            document.getElementById('modal-round-text').innerText = `Month ${round} Settlement`;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('result-modal').classList.add('hidden');
            if (isHost) {
                round++;
                if (round > 12) return alert("Fiscal Year End!");
                startRound();
            }
        }

        function updateHeader() {
            document.getElementById('balance').innerText = `$${Math.floor(myBalance).toLocaleString()}`;
            document.getElementById('opp-balance').innerText = `$${(oppBalance/1000000).toFixed(1)}M`;
            document.getElementById('round-num').innerText = round;
        }

        function filterLeague(l, btn) {
            document.querySelectorAll('.league-btn').forEach(b => {
                b.className = 'league-btn px-5 py-2 rounded-xl text-[10px] font-black whitespace-nowrap bg-slate-800 text-slate-500 uppercase tracking-widest';
            });
            btn.className = 'league-btn px-5 py-2 rounded-xl text-[10px] font-black whitespace-nowrap bg-blue-600 text-white uppercase tracking-widest';
            renderFixtures(l);
        }
    </script>
</body>
</html>
