<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Football Capital: Mobile Sim</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #020617; color: #f8fafc; overflow-x: hidden; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        .bet-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .bet-card:active { transform: scale(0.98); }
        .league-tab-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="lobby" class="flex-grow flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-sm glass rounded-3xl p-8 text-center shadow-2xl border-blue-500/20 border-2">
            <div class="mb-6">
                <div class="text-5xl mb-2">🏆</div>
                <h1 class="text-3xl font-black bg-gradient-to-br from-white to-slate-400 bg-clip-text text-transparent">FOOTBALL CAPITAL</h1>
                <p class="text-slate-500 text-xs tracking-widest uppercase mt-1">Global Investment Firm</p>
            </div>
            
            <div id="connection-ui">
                <button onclick="initializeHost()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold text-lg mb-4 shadow-lg shadow-blue-900/40 active:scale-95 transition-transform">Host New Game</button>
                <div class="flex items-center gap-4 my-6 text-slate-600 text-xs font-bold">
                    <div class="h-px bg-slate-800 flex-grow"></div> OR <div class="h-px bg-slate-800 flex-grow"></div>
                </div>
                <input type="number" id="joinId" inputmode="numeric" placeholder="4-Digit PIN" class="w-full bg-slate-900 border-2 border-slate-800 p-4 rounded-2xl mb-3 text-center text-2xl font-black tracking-[1em] focus:border-blue-500 outline-none transition-colors">
                <button onclick="joinGame()" class="w-full bg-slate-800 hover:bg-slate-700 py-4 rounded-2xl font-bold">Join Room</button>
            </div>
            <div id="status" class="mt-6 text-blue-400 font-mono text-sm"></div>
        </div>
    </div>

    <div id="game-container" class="hidden flex-col h-screen overflow-hidden">
        <div class="glass border-b border-white/5 p-4 flex justify-between items-center z-20">
            <div>
                <p class="text-[10px] uppercase font-black text-slate-500 leading-tight">Month <span id="round-num">1</span>/10</p>
                <h2 id="balance" class="text-xl font-black text-emerald-400">$1,000,000</h2>
            </div>
            <div class="flex flex-col items-center">
                <div id="round-timer" class="text-2xl font-black tabular-nums text-blue-400">90s</div>
                <div class="w-24 h-1 bg-slate-800 rounded-full mt-1 overflow-hidden">
                    <div id="timer-bar" class="h-full bg-blue-500 transition-all duration-1000" style="width: 100%"></div>
                </div>
            </div>
            <div class="text-right">
                <p class="text-[10px] uppercase font-black text-slate-500 leading-tight">Rival Capital</p>
                <h2 id="opp-balance" class="text-xl font-black text-slate-300">$1,000,000</h2>
            </div>
        </div>

        <div class="flex overflow-x-auto bg-slate-950/50 border-b border-white/5 px-2 py-3 gap-2 no-scrollbar">
            <button onclick="filterLeague('All')" class="league-btn px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-blue-600">All Markets</button>
            <button onclick="filterLeague('Premier League')" class="league-btn px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-slate-800">PL</button>
            <button onclick="filterLeague('La Liga')" class="league-btn px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-slate-800">La Liga</button>
            <button onclick="filterLeague('Bundesliga')" class="league-btn px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-slate-800">B-Liga</button>
            <button onclick="filterLeague('Serie A')" class="league-btn px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-slate-800">Serie A</button>
            <button onclick="filterLeague('Ligue 1')" class="league-btn px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-slate-800">Ligue 1</button>
        </div>

        <div id="fixtures-list" class="flex-grow overflow-y-auto p-4 space-y-3 pb-32">
            </div>

        <div class="fixed bottom-0 left-0 right-0 glass border-t border-white/10 p-4 safe-area-bottom z-30">
            <div class="flex items-center justify-between gap-4 max-w-2xl mx-auto">
                <div class="flex flex-col">
                    <span id="active-count" class="text-xs font-bold text-slate-400">0 Positions Open</span>
                    <span id="total-stake-display" class="text-sm font-black text-white">Stake: $0</span>
                </div>
                <button id="lock-bets-btn" onclick="submitBets()" class="flex-grow bg-emerald-600 py-4 rounded-2xl font-black uppercase tracking-widest text-sm shadow-xl shadow-emerald-900/30 active:scale-95 transition-all">
                    Submit Portfolio
                </button>
            </div>
        </div>
    </div>

    <div id="result-modal" class="fixed inset-0 bg-slate-950/95 z-50 hidden flex flex-col items-center justify-center p-8 text-center">
        <div class="text-6xl mb-4">📊</div>
        <h2 class="text-2xl font-black mb-1">MARKET RESULTS</h2>
        <p id="modal-round-text" class="text-slate-500 text-sm mb-6">Round 1 Summary</p>
        <div id="modal-pnl" class="text-5xl font-black mb-8">+$0</div>
        <div id="modal-logs" class="w-full max-w-xs h-40 overflow-y-auto text-xs space-y-2 mb-8 text-slate-400 font-mono text-left bg-black/40 p-4 rounded-xl">
            </div>
        <button onclick="closeModal()" class="w-full max-w-xs bg-blue-600 py-4 rounded-2xl font-bold">Return to Markets</button>
    </div>

    <script>
        const LEAGUES = {
            "Premier League": { teams: ["Man City", "Arsenal", "Liverpool", "Chelsea", "Man Utd", "Spurs", "Newcastle", "Aston Villa", "Everton", "West Ham"], stars: ["Haaland", "Saka", "Salah", "Palmer"] },
            "La Liga": { teams: ["Real Madrid", "Barcelona", "Atlético Madrid", "Girona", "Real Sociedad", "Athletic Club", "Villarreal", "Sevilla"], stars: ["Mbappe", "Yamal", "Griezmann", "Lewandowski"] },
            "Bundesliga": { teams: ["Bayer Leverkusen", "Bayern Munich", "Dortmund", "RB Leipzig", "Stuttgart", "Eintracht Frankfurt"], stars: ["Kane", "Wirtz", "Musiala", "Brandt"] },
            "Serie A": { teams: ["Inter Milan", "AC Milan", "Juventus", "Atalanta", "AS Roma", "Napoli", "Lazio", "Fiorentina"], stars: ["Lautaro", "Leao", "Vlahovic", "Dybala"] },
            "Ligue 1": { teams: ["PSG", "Monaco", "Lille", "Brest", "Nice", "Lyon", "Marseille", "Lens"], stars: ["Dembele", "David", "Lacazette", "Golovin"] },
            "Champions League": { teams: ["Real Madrid", "Man City", "Bayern Munich", "Inter Milan", "PSG", "Arsenal", "Liverpool", "Barcelona"], stars: ["Vinicius", "De Bruyne", "Kane", "Rodri"] }
        };

        const ID_PREFIX = "FCAP-";
        let peer, conn, myBalance = 1000000, oppBalance = 1000000, isHost = false, gameActive = false;
        let round = 1, timeLeft = 90, myBets = {}, currentFixtures = [], timerInterval;

        function initializeHost() {
            const shortId = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(ID_PREFIX + shortId);
            peer.on('open', (id) => {
                document.getElementById('status').innerHTML = `Game PIN: <span class="text-white text-3xl block mt-2 font-black">${shortId}</span><br>Tell Player 2 to join!`;
                isHost = true;
                document.querySelector('#connection-ui button').disabled = true;
            });
            peer.on('connection', (c) => { conn = c; setupConnection(); });
        }

        function joinGame() {
            const pin = document.getElementById('joinId').value;
            if (pin.length !== 4) return alert("Enter 4 digits");
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(ID_PREFIX + pin);
                setupConnection();
            });
            peer.on('error', () => alert("Game not found!"));
        }

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('lobby').classList.add('hidden');
                document.getElementById('game-container').classList.remove('hidden');
                gameActive = true;
                if (isHost) startRound();
            });
            conn.on('data', (data) => {
                if (data.type === 'SYNC') {
                    currentFixtures = data.fixtures;
                    round = data.round;
                    timeLeft = data.timeLeft;
                    renderFixtures();
                    if(!timerInterval) runClock();
                }
                if (data.type === 'RESULTS') processResults(data.results);
                if (data.type === 'OPP_UPDATE') { oppBalance = data.bal; updateHeader(); }
            });
        }

        function runClock() {
            timerInterval = setInterval(() => {
                if(timeLeft > 0) {
                    timeLeft--;
                    document.getElementById('round-timer').innerText = timeLeft + "s";
                    document.getElementById('timer-bar').style.width = (timeLeft/90*100) + "%";
                } else if(isHost) {
                    simulateRound();
                }
            }, 1000);
        }

        function startRound() {
            myBets = {};
            currentFixtures = [];
            Object.keys(LEAGUES).forEach(league => {
                const teams = LEAGUES[league].teams;
                for(let i=0; i<2; i++) {
                    const t1 = teams[Math.floor(Math.random()*teams.length)];
                    let t2 = teams[Math.floor(Math.random()*teams.length)];
                    while(t1 === t2) t2 = teams[Math.floor(Math.random()*teams.length)];
                    const s1 = Math.random()+0.5, s2 = Math.random()+0.5;
                    currentFixtures.push({
                        id: Math.random().toString(36).substr(2, 5),
                        league, h: t1, a: t2, 
                        oh: (1/(s1/(s1+s2))+0.2).toFixed(2), 
                        oa: (1/(s2/(s1+s2))+0.2).toFixed(2),
                        s1, s2, star: LEAGUES[league].stars[Math.floor(Math.random()*4)]
                    });
                }
            });
            timeLeft = 90;
            broadcastSync();
            renderFixtures();
            if(!timerInterval) runClock();
        }

        function broadcastSync() {
            conn.send({ type: 'SYNC', fixtures: currentFixtures, round, timeLeft });
        }

        function renderFixtures(filter = 'All') {
            const list = document.getElementById('fixtures-list');
            list.innerHTML = '';
            currentFixtures.filter(f => filter === 'All' || f.league === filter).forEach(f => {
                const div = document.createElement('div');
                div.className = 'glass p-4 rounded-2xl bet-card border-l-4 ' + (f.league === 'Champions League' ? 'border-l-yellow-500' : 'border-l-blue-500');
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-[9px] font-black uppercase text-slate-500">${f.league} • <span class="text-blue-400">Featured: ${f.star}</span></span>
                    </div>
                    <div class="flex items-center justify-between gap-2 mb-4">
                        <div class="text-center flex-1">
                            <img src="https://api.dicebear.com/7.x/identicon/svg?seed=${f.h}" class="w-8 h-8 mx-auto mb-1 rounded-lg">
                            <div class="text-xs font-bold leading-tight">${f.h}</div>
                        </div>
                        <div class="text-slate-600 font-black text-xs">VS</div>
                        <div class="text-center flex-1">
                            <img src="https://api.dicebear.com/7.x/identicon/svg?seed=${f.a}" class="w-8 h-8 mx-auto mb-1 rounded-lg">
                            <div class="text-xs font-bold leading-tight">${f.a}</div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="selectSide('${f.id}','h')" id="btn-${f.id}-h" class="bg-slate-900 border border-slate-800 py-2 rounded-xl text-xs font-bold">Home ${f.oh}x</button>
                        <button onclick="selectSide('${f.id}','a')" id="btn-${f.id}-a" class="bg-slate-900 border border-slate-800 py-2 rounded-xl text-xs font-bold">Away ${f.oa}x</button>
                    </div>
                    <input type="number" inputmode="numeric" placeholder="Stake $" onchange="updateStake('${f.id}', this.value)" class="w-full bg-black/40 border border-white/5 mt-2 p-2 rounded-lg text-center text-sm font-bold text-emerald-400 outline-none">
                `;
                list.appendChild(div);
            });
            updateBetDisplay();
        }

        function selectSide(id, side) {
            if(!myBets[id]) myBets[id] = { stake: 0 };
            myBets[id].side = side;
            document.querySelectorAll(`[id^="btn-${id}-"]`).forEach(b => b.classList.replace('bg-blue-600', 'bg-slate-900'));
            document.getElementById(`btn-${id}-${side}`).classList.replace('bg-slate-900', 'bg-blue-600');
            updateBetDisplay();
        }

        function updateStake(id, val) {
            if(!myBets[id]) myBets[id] = { side: 'h' };
            myBets[id].stake = parseInt(val) || 0;
            updateBetDisplay();
        }

        function updateBetDisplay() {
            const count = Object.values(myBets).filter(b => b.stake > 0).length;
            const total = Object.values(myBets).reduce((a,b) => a + b.stake, 0);
            document.getElementById('active-count').innerText = `${count} Positions Open`;
            document.getElementById('total-stake-display').innerText = `Stake: $${total.toLocaleString()}`;
        }

        function submitBets() {
            const total = Object.values(myBets).reduce((a,b) => a + b.stake, 0);
            if(total > myBalance) return alert("Insufficient Funds!");
            document.getElementById('lock-bets-btn').disabled = true;
            document.getElementById('lock-bets-btn').innerText = "Locked - Awaiting Results";
        }

        function simulateRound() {
            const results = currentFixtures.map(f => {
                const winner = (Math.random()*(f.s1+f.s2)) < f.s1 ? 'h' : 'a';
                return { id: f.id, winner, h: f.h, a: f.a };
            });
            conn.send({ type: 'RESULTS', results });
            processResults(results);
        }

        function processResults(results) {
            let pnl = 0, logs = [];
            results.forEach(res => {
                const bet = myBets[res.id];
                const fix = currentFixtures.find(f => f.id === res.id);
                if(bet && bet.stake > 0) {
                    if(bet.side === res.winner) {
                        const win = bet.stake * (res.winner === 'h' ? fix.oh : fix.oa);
                        pnl += (win - bet.stake);
                        logs.push(`<div class="text-emerald-400">✓ ${res.h} Win (+$${Math.floor(win).toLocaleString()})</div>`);
                    } else {
                        pnl -= bet.stake;
                        logs.push(`<div class="text-rose-500">✗ ${res.h} vs ${res.a} (-$${bet.stake.toLocaleString()})</div>`);
                    }
                }
            });
            myBalance += pnl;
            updateHeader();
            showResults(pnl, logs);
            conn.send({ type: 'OPP_UPDATE', bal: myBalance });
        }

        function updateHeader() {
            document.getElementById('balance').innerText = `$${Math.floor(myBalance).toLocaleString()}`;
            document.getElementById('opp-balance').innerText = `$${Math.floor(oppBalance).toLocaleString()}`;
            document.getElementById('round-num').innerText = round;
        }

        function showResults(pnl, logs) {
            const modal = document.getElementById('result-modal');
            const pnlEl = document.getElementById('modal-pnl');
            pnlEl.innerText = (pnl >= 0 ? "+$" : "-$") + Math.abs(Math.floor(pnl)).toLocaleString();
            pnlEl.className = pnl >= 0 ? "text-5xl font-black mb-8 text-emerald-400" : "text-5xl font-black mb-8 text-rose-500";
            document.getElementById('modal-logs').innerHTML = logs.length ? logs.join('') : "No investments made this round.";
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('lock-bets-btn').disabled = false;
            document.getElementById('lock-bets-btn').innerText = "Submit Portfolio";
            if(isHost) {
                round++;
                if(round > 10) return endGame();
                startRound();
            }
        }

        function filterLeague(l) {
            document.querySelectorAll('.league-btn').forEach(b => b.classList.replace('bg-blue-600', 'bg-slate-800'));
            event.target.classList.replace('bg-slate-800', 'bg-blue-600');
            renderFixtures(l);
        }

        function endGame() {
            alert("Fiscal Year Complete. Final Capital: $" + myBalance.toLocaleString());
            location.reload();
        }
    </script>
</body>
</html>
