<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Football Capital | Elite Trading</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');
        
        :root {
            --bg: #020617;
            --accent: #3b82f6;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: var(--bg); color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        /* FLEXBOX LAYOUT FOR SCROLLING */
        .app-shell {
            display: flex;
            flex-direction: column;
            height: 100dvh;
        }

        .header, .footer { flex-shrink: 0; z-index: 50; }

        .main-scroll {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 140px; /* Space for sticky footer */
        }

        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .card-pro { background: linear-gradient(145deg, rgba(30, 41, 59, 0.4), rgba(15, 23, 42, 0.6)); border: 1px solid rgba(255,255,255,0.05); border-radius: 2rem; }
        
        .active-bet { border-color: var(--accent) !important; background: rgba(59, 130, 246, 0.2) !important; box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }

        .btn-tap:active { transform: scale(0.96); transition: transform 0.1s; }

        /* Results Statement Animation */
        .settlement-card { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideIn { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="lobby" class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-[#020617]">
        <div class="w-full max-w-sm glass rounded-[2.5rem] p-8 text-center shadow-2xl border-white/10 border">
            <h1 class="text-4xl font-black tracking-tighter mb-2 leading-none text-white">FOOTBALL<br><span class="text-blue-500">CAPITAL</span></h1>
            <p class="text-slate-500 text-[10px] tracking-[0.4em] uppercase mb-10 font-bold">Investment Firm Sim</p>
            
            <div id="connection-ui" class="space-y-4">
                <button onclick="initializeHost()" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-xs tracking-widest btn-tap shadow-lg shadow-blue-900/40">HOST NEW FIRM</button>
                <div class="flex items-center gap-3 py-2"><div class="h-px bg-slate-800 flex-grow"></div><span class="text-[10px] font-black text-slate-600 uppercase">OR</span><div class="h-px bg-slate-800 flex-grow"></div></div>
                <input type="number" id="joinId" inputmode="numeric" placeholder="4-DIGIT PIN" class="w-full bg-slate-900/50 border border-slate-800 p-4 rounded-2xl text-center text-3xl font-black tracking-[0.5em] focus:border-blue-500 outline-none text-white">
                <button onclick="joinGame()" class="w-full bg-slate-800 py-4 rounded-2xl font-black text-xs tracking-widest btn-tap">JOIN COMPETITOR</button>
            </div>
            <div id="status" class="mt-8 text-blue-400 font-mono text-xs font-bold animate-pulse"></div>
        </div>
    </div>

    <div id="game-container" class="hidden app-shell">
        
        <div class="header glass p-4 grid grid-cols-3 items-center">
            <div>
                <p class="text-[9px] uppercase font-black text-slate-500 tracking-widest">Equity</p>
                <h2 id="balance" class="text-lg font-black text-emerald-400 leading-none">$1,000,000</h2>
            </div>
            <div class="text-center">
                <div id="round-timer" class="text-3xl font-black tabular-nums tracking-tighter text-white">90</div>
                <div class="text-[8px] font-black uppercase text-blue-500 tracking-widest">Market Open</div>
            </div>
            <div class="text-right">
                <p class="text-[9px] uppercase font-black text-slate-500 tracking-widest">Month <span id="round-num">1</span></p>
                <h2 id="opp-balance" class="text-lg font-black text-slate-400 leading-none">$1.0M</h2>
            </div>
        </div>

        <div class="header flex overflow-x-auto bg-slate-950/40 px-4 py-3 gap-2 no-scrollbar border-b border-white/5">
            <button onclick="filterLeague('All', this)" class="league-btn px-5 py-2 rounded-xl text-[10px] font-black whitespace-nowrap bg-blue-600 uppercase tracking-widest">Global</button>
            <button onclick="filterLeague('Premier League', this)" class="league-btn px-5 py-2 rounded-xl text-[10px] font-black whitespace-nowrap bg-slate-800 text-slate-500 uppercase">PL</button>
            <button onclick="filterLeague('La Liga', this)" class="league-btn px-5 py-2 rounded-xl text-[10px] font-black whitespace-nowrap bg-slate-800 text-slate-500 uppercase">La Liga</button>
            <button onclick="filterLeague('Champions League', this)" class="league-btn px-5 py-2 rounded-xl text-[10px] font-black whitespace-nowrap bg-slate-800 text-slate-500 uppercase">UCL</button>
        </div>

        <div id="fixtures-list" class="main-scroll p-4 space-y-4">
            </div>

        <div class="footer glass p-5 pb-8 border-t border-white/10 shadow-2xl">
            <div class="flex items-center justify-between gap-4 max-w-xl mx-auto">
                <div class="w-1/3">
                    <p id="active-count" class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">0 Active</p>
                    <div id="total-stake-display" class="text-xl font-black text-white leading-none">$0</div>
                </div>
                <button id="lock-bets-btn" onclick="submitBets()" class="flex-grow bg-blue-600 py-4 rounded-2xl font-black uppercase tracking-widest text-[10px] btn-tap shadow-lg shadow-blue-900/30">
                    LOCK PORTFOLIO
                </button>
            </div>
        </div>
    </div>

    <div id="result-modal" class="fixed inset-0 z-[110] hidden flex items-center justify-center p-6 bg-black/80">
        <div class="w-full max-w-sm glass rounded-[3rem] p-8 text-center border-white/20 border shadow-2xl settlement-card relative">
            <p id="modal-round-text" class="text-blue-500 text-[10px] font-black uppercase tracking-[0.4em] mb-4">Month Settlement</p>
            <div id="modal-pnl" class="text-5xl font-black tracking-tighter mb-8">+$0</div>
            <div id="modal-logs" class="space-y-3 mb-10 max-h-[30vh] overflow-y-auto no-scrollbar"></div>
            <button onclick="closeModal()" class="w-full bg-white text-black py-4 rounded-[2rem] font-black uppercase tracking-widest text-xs btn-tap">Continue Trading</button>
        </div>
    </div>

    <script>
        // Mapping names to GitHub filenames in luukhopman/football-logos/logos/128x128
        const REPO_BASE = "https://raw.githubusercontent.com/luukhopman/football-logos/master/logos/128x128/";
        const TEAM_MAP = {
            "Man City": "manchester-city.png", "Arsenal": "arsenal.png", "Liverpool": "liverpool.png", 
            "Chelsea": "chelsea.png", "Man Utd": "manchester-united.png", "Tottenham": "tottenham-hotspur.png",
            "Newcastle": "newcastle-united.png", "Aston Villa": "aston-villa.png", "Real Madrid": "real-madrid.png", 
            "Barcelona": "fc-barcelona.png", "Atletico Madrid": "atletico-madrid.png", "Girona": "girona.png", 
            "Real Sociedad": "real-sociedad.png", "Sevilla": "sevilla.png", "PSG": "paris-saint-germain.png", 
            "Bayern Munich": "bayern-munchen.png", "Leverkusen": "bayer-leverkusen.png", "Dortmund": "borussia-dortmund.png", 
            "Inter Milan": "internazionale.png", "AC Milan": "ac-milan.png", "Juventus": "juventus.png"
        };

        const ID_PREFIX = "FCAP-2026-";
        let peer, conn, myBalance = 1000000, oppBalance = 1000000, isHost = false;
        let round = 1, timeLeft = 90, myBets = {}, currentFixtures = [], timerInterval = null;
        let hostReady = false, joinerReady = false;

        function getLogo(name) {
            const filename = TEAM_MAP[name];
            return filename ? REPO_BASE + filename : `https://ui-avatars.com/api/?name=${name}&background=334155&color=fff`;
        }

        function initializeHost() {
            const pin = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(ID_PREFIX + pin);
            peer.on('open', () => {
                document.getElementById('status').innerHTML = `PIN: <span class="text-white text-3xl block mt-2 font-black">${pin}</span>`;
                isHost = true;
            });
            peer.on('connection', (c) => { conn = c; setupConnection(); });
        }

        function joinGame() {
            const pin = document.getElementById('joinId').value;
            if (pin.length !== 4) return;
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(ID_PREFIX + pin);
                setupConnection();
            });
            peer.on('error', () => alert("Room Not Found"));
        }

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('lobby').classList.add('hidden');
                document.getElementById('game-container').classList.remove('hidden');
                if (isHost) startRound();
            });
            conn.on('data', (data) => {
                if (data.type === 'SYNC') {
                    currentFixtures = data.fixtures;
                    round = data.round;
                    timeLeft = data.timeLeft;
                    resetRound();
                }
                if (data.type === 'RESULTS') processResults(data.results);
                if (data.type === 'READY') {
                    joinerReady = true;
                    if (hostReady) simulateRound();
                }
                if (data.type === 'BAL') {
                    oppBalance = data.bal;
                    updateDashboard();
                }
            });
        }

        function startRound() {
            hostReady = false; joinerReady = false;
            currentFixtures = [];
            const leagues = ["Premier League", "La Liga", "Champions League"];
            leagues.forEach(league => {
                const pool = Object.keys(TEAM_MAP);
                for(let i=0; i<2; i++) {
                    const h = pool[Math.floor(Math.random()*pool.length)];
                    let a = pool[Math.floor(Math.random()*pool.length)];
                    while(a === h) a = pool[Math.floor(Math.random()*pool.length)];
                    const s1 = Math.random() + 0.5, s2 = Math.random() + 0.5;
                    currentFixtures.push({
                        id: Math.random().toString(36).substr(2, 5),
                        league, h, a,
                        oh: (1/(s1/(s1+s2)) + 0.1).toFixed(2),
                        oa: (1/(s2/(s1+s2)) + 0.1).toFixed(2),
                        s1, s2
                    });
                }
            });
            timeLeft = 90;
            conn.send({ type: 'SYNC', fixtures: currentFixtures, round, timeLeft });
            resetRound();
        }

        function resetRound() {
            myBets = {};
            const btn = document.getElementById('lock-bets-btn');
            btn.disabled = false;
            btn.innerText = "LOCK PORTFOLIO";
            btn.classList.replace('bg-slate-700', 'bg-blue-600');
            renderFixtures('All');
            updateDashboard();
            startTimer();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval); // CRITICAL FIX: Clear old timer
            const timerEl = document.getElementById('round-timer');
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    if (isHost) simulateRound();
                }
            }, 1000);
        }

        function renderFixtures(filter) {
            const list = document.getElementById('fixtures-list');
            list.innerHTML = '';
            currentFixtures.filter(f => filter === 'All' || f.league === filter).forEach(f => {
                const card = document.createElement('div');
                card.className = `p-6 card-pro flex flex-col gap-5`;
                card.innerHTML = `
                    <div class="flex justify-between items-center"><span class="text-[8px] font-black uppercase text-blue-500 tracking-[0.2em] px-3 py-1 bg-blue-500/10 rounded-full">${f.league}</span></div>
                    <div class="flex items-center justify-between">
                        <div class="flex-1 text-center">
                            <img src="${getLogo(f.h)}" class="w-14 h-14 mx-auto mb-2 shadow-xl object-contain">
                            <div class="text-[10px] font-black uppercase truncate text-white">${f.h}</div>
                        </div>
                        <div class="text-[10px] font-black text-slate-700 italic px-2">VS</div>
                        <div class="flex-1 text-center">
                            <img src="${getLogo(f.a)}" class="w-14 h-14 mx-auto mb-2 shadow-xl object-contain">
                            <div class="text-[10px] font-black uppercase truncate text-white">${f.a}</div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="pick('${f.id}','h')" id="b-${f.id}-h" class="bg-slate-900 border border-slate-800 py-3 rounded-2xl text-[10px] font-black transition-all btn-tap uppercase text-slate-400">BUY ${f.oh}x</button>
                        <button onclick="pick('${f.id}','a')" id="b-${f.id}-a" class="bg-slate-900 border border-slate-800 py-3 rounded-2xl text-[10px] font-black transition-all btn-tap uppercase text-slate-400">BUY ${f.oa}x</button>
                    </div>
                    <input type="number" inputmode="numeric" placeholder="INVESTMENT" oninput="stake('${f.id}', this.value)" class="w-full bg-black/40 border border-white/5 py-4 px-6 rounded-2xl text-center text-xs font-black text-emerald-400 outline-none focus:border-blue-500 text-white">
                `;
                list.appendChild(card);
            });
            updateSummary();
        }

        function pick(id, side) {
            if (!myBets[id]) myBets[id] = { stake: 0 };
            myBets[id].side = side;
            document.querySelectorAll(`[id^="b-${id}-"]`).forEach(b => b.classList.remove('active-bet'));
            document.getElementById(`b-${id}-${side}`).classList.add('active-bet');
            updateSummary();
        }

        function stake(id, val) {
            if (!myBets[id]) myBets[id] = { side: 'h' };
            myBets[id].stake = Math.abs(parseInt(val)) || 0;
            updateSummary();
        }

        function updateSummary() {
            const bets = Object.values(myBets).filter(b => b.stake > 0);
            const total = bets.reduce((a, b) => a + b.stake, 0);
            document.getElementById('active-count').innerText = `${bets.length} ACTIVE`;
            document.getElementById('total-stake-display').innerText = `$${total.toLocaleString()}`;
        }

        function submitBets() {
            const total = Object.values(myBets).reduce((a, b) => a + b.stake, 0);
            if (total > myBalance) return alert("Liquidity Low!");
            const btn = document.getElementById('lock-bets-btn');
            btn.disabled = true;
            btn.innerText = "WAITING FOR PARTNER...";
            btn.classList.replace('bg-blue-600', 'bg-slate-700');
            if (isHost) { hostReady = true; if (joinerReady) simulateRound(); }
            else { conn.send({ type: 'READY' }); }
        }

        function simulateRound() {
            if (!isHost) return;
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } // Stop timer on simulation
            const results = currentFixtures.map(f => ({
                id: f.id, winner: (Math.random()*(f.s1+f.s2)) < f.s1 ? 'h' : 'a'
            }));
            conn.send({ type: 'RESULTS', results });
            processResults(results);
        }

        function processResults(results) {
            let pnl = 0, logs = [];
            results.forEach(res => {
                const bet = myBets[res.id], fix = currentFixtures.find(f => f.id === res.id);
                if (bet && bet.stake > 0) {
                    if (bet.side === res.winner) {
                        const win = bet.stake * (res.winner === 'h' ? fix.oh : fix.oa);
                        pnl += (win - bet.stake);
                        logs.push(`<div class="flex justify-between p-4 bg-emerald-500/5 border border-emerald-500/10 text-left"><div class="text-[10px] font-bold text-white uppercase">${fix.h} VS ${fix.a}</div><div class="text-emerald-400 font-black text-sm">+$${Math.floor(win).toLocaleString()}</div></div>`);
                    } else {
                        pnl -= bet.stake;
                        logs.push(`<div class="flex justify-between p-4 bg-rose-500/5 border border-rose-500/10 text-left"><div class="text-[10px] font-bold text-white uppercase">${fix.h} VS ${fix.a}</div><div class="text-rose-400 font-black text-sm">-$${bet.stake.toLocaleString()}</div></div>`);
                    }
                }
            });
            myBalance += pnl;
            showResults(pnl, logs);
            conn.send({ type: 'BAL', bal: myBalance });
        }

        function showResults(pnl, logs) {
            const modal = document.getElementById('result-modal');
            const pnlEl = document.getElementById('modal-pnl');
            pnlEl.innerText = (pnl >= 0 ? "+$" : "-$") + Math.abs(Math.floor(pnl)).toLocaleString();
            pnlEl.className = pnl >= 0 ? "text-6xl font-black tracking-tighter text-emerald-400 mb-8" : "text-6xl font-black tracking-tighter text-rose-500 mb-8";
            document.getElementById('modal-logs').innerHTML = logs.length ? logs.join('') : '<p class="text-slate-600 font-black uppercase text-[10px] py-10">No positions taken</p>';
            document.getElementById('modal-round-text').innerText = `Month ${round} Settlement`;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('result-modal').classList.add('hidden');
            if (isHost) {
                round++;
                if (round > 12) return alert("Fiscal Year End!");
                startRound();
            }
        }

        function updateDashboard() {
            document.getElementById('balance').innerText = `$${Math.floor(myBalance).toLocaleString()}`;
            document.getElementById('opp-balance').innerText = `$${(oppBalance/1000000).toFixed(1)}M`;
            document.getElementById('round-num').innerText = round;
        }

        function filterLeague(l, btn) {
            document.querySelectorAll('.league-btn').forEach(b => b.className = 'league-btn px-5 py-2 rounded-xl text-[10px] font-black whitespace-nowrap bg-slate-800 text-slate-500 uppercase');
            btn.className = 'league-btn px-5 py-2 rounded-xl text-[10px] font-black whitespace-nowrap bg-blue-600 text-white uppercase';
            renderFixtures(l);
        }
    </script>
</body>
</html>
