<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Football Capital | Global Markets</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');
        
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: #020617; color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            overflow: hidden; /* Prevents the whole page from bouncing */
        }

        /* THE SCROLL FIX */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh; /* Fallback */
            height: 100dvh; /* Modern mobile-aware height */
        }

        .header, .footer { flex-shrink: 0; }

        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* Smooth iOS scrolling */
            padding-bottom: 20px;
        }

        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .card-gradient { background: linear-gradient(145deg, rgba(30, 41, 59, 0.6), rgba(15, 23, 42, 0.8)); border: 1px solid rgba(255,255,255,0.05); }
        
        .active-side { border-color: #3b82f6 !important; background: rgba(59, 130, 246, 0.2) !important; color: white !important; }

        /* Custom Scrollbar for Desktop */
        .main-content::-webkit-scrollbar { width: 4px; }
        .main-content::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }

        /* Result Animation */
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .result-entry { animation: popIn 0.3s ease-out forwards; }
    </style>
</head>
<body>

    <div id="lobby" class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-[#020617]">
        <div class="w-full max-w-sm card-gradient rounded-[2.5rem] p-8 text-center shadow-2xl border-white/10 border">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto mb-6 flex items-center justify-center shadow-lg shadow-blue-900/40">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h1 class="text-4xl font-black tracking-tighter mb-8 leading-none">FOOTBALL<br><span class="text-blue-500 text-3xl">CAPITAL</span></h1>
            
            <div id="connection-ui" class="space-y-4">
                <button onclick="initializeHost()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-black text-sm tracking-widest transition-all active:scale-95">HOST NEW FIRM</button>
                <div class="flex items-center gap-3 py-2"><div class="h-px bg-slate-800 flex-grow"></div><span class="text-[10px] font-black text-slate-600 uppercase">Partner Join</span><div class="h-px bg-slate-800 flex-grow"></div></div>
                <input type="number" id="joinId" inputmode="numeric" placeholder="4-Digit PIN" class="w-full bg-slate-900/50 border border-slate-800 p-4 rounded-2xl text-center text-3xl font-black tracking-[0.4em] focus:border-blue-500 outline-none">
                <button onclick="joinGame()" class="w-full bg-slate-800 py-4 rounded-2xl font-black text-sm tracking-widest transition-all">JOIN ROOM</button>
            </div>
            <div id="status" class="mt-8 text-blue-400 font-mono text-xs font-bold animate-pulse"></div>
        </div>
    </div>

    <div id="game-container" class="hidden app-container">
        
        <div class="header glass p-4 flex justify-between items-center z-20">
            <div>
                <p class="text-[9px] uppercase font-black text-slate-500">Equity Value</p>
                <h2 id="balance" class="text-xl font-black text-emerald-400">$1,000,000</h2>
            </div>
            <div class="text-center">
                <div id="round-timer" class="text-3xl font-black tabular-nums leading-none">90</div>
                <p class="text-[8px] font-black uppercase text-blue-500 tracking-tighter">Market Open</p>
            </div>
            <div class="text-right">
                <p class="text-[9px] uppercase font-black text-slate-500">Fiscal Month <span id="round-num">1</span></p>
                <h2 id="opp-balance" class="text-xl font-black text-slate-500">$1.0M</h2>
            </div>
        </div>

        <div class="header flex overflow-x-auto bg-slate-950/40 px-4 py-3 gap-2 no-scrollbar border-b border-white/5">
            <button onclick="filterLeague('All', this)" class="league-btn px-5 py-2 rounded-xl text-[10px] font-black whitespace-nowrap bg-blue-600 uppercase tracking-widest">Global</button>
            <button onclick="filterLeague('Premier League', this)" class="league-btn px-5 py-2 rounded-xl text-[10px] font-black whitespace-nowrap bg-slate-800 text-slate-500 uppercase">England</button>
            <button onclick="filterLeague('La Liga', this)" class="league-btn px-5 py-2 rounded-xl text-[10px] font-black whitespace-nowrap bg-slate-800 text-slate-500 uppercase">Spain</button>
            <button onclick="filterLeague('Champions League', this)" class="league-btn px-5 py-2 rounded-xl text-[10px] font-black whitespace-nowrap bg-slate-800 text-slate-500 uppercase">UCL</button>
        </div>

        <div id="fixtures-list" class="main-content p-4 space-y-4">
            </div>

        <div class="footer glass p-5 pb-8 border-t border-white/10">
            <div class="flex items-center justify-between gap-4 max-w-xl mx-auto">
                <div class="w-1/3">
                    <p id="active-count" class="text-[9px] font-black text-slate-500 uppercase mb-1">0 Markets</p>
                    <div id="total-stake-display" class="text-lg font-black text-white leading-none">$0</div>
                </div>
                <button id="lock-bets-btn" onclick="submitBets()" class="flex-grow bg-blue-600 py-4 rounded-2xl font-black uppercase tracking-widest text-xs shadow-xl active:scale-95 transition-all">
                    LOCK PORTFOLIO
                </button>
            </div>
        </div>
    </div>

    <div id="result-modal" class="fixed inset-0 z-[110] hidden flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-[#0a0f1d] rounded-[3rem] p-8 text-center border-white/10 border shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-24 bg-gradient-to-b from-blue-600/10 to-transparent"></div>
            
            <div class="relative z-10">
                <p id="modal-round-text" class="text-blue-500 text-[10px] font-black uppercase tracking-[0.3em] mb-4">Round Settlement</p>
                <div id="modal-pnl" class="text-6xl font-black tracking-tighter mb-8">+$0</div>

                <div id="modal-logs" class="space-y-3 mb-10 max-h-[40vh] overflow-y-auto pr-2 no-scrollbar">
                    </div>

                <button onclick="closeModal()" class="w-full bg-white text-black py-4 rounded-[2rem] font-black uppercase tracking-widest text-xs active:scale-95 transition-transform">Next Fiscal Period</button>
            </div>
        </div>
    </div>

    <script>
        const CLUBS = {
            "Premier League": ["Man City", "Arsenal", "Liverpool", "Chelsea", "Man Utd", "Tottenham", "Newcastle", "Aston Villa"],
            "La Liga": ["Real Madrid", "Barcelona", "Atletico Madrid", "Girona", "Real Sociedad", "Sevilla"],
            "Bundesliga": ["Leverkusen", "Bayern Munich", "Dortmund", "Leipzig", "Stuttgart"],
            "Serie A": ["Inter Milan", "AC Milan", "Juventus", "Atalanta", "Napoli"],
            "Champions League": ["Real Madrid", "Man City", "Bayern Munich", "Inter Milan", "PSG", "Arsenal"]
        };

        const ID_PREFIX = "FC-2026-";
        let peer, conn, myBalance = 1000000, oppBalance = 1000000, isHost = false;
        let round = 1, timeLeft = 90, myBets = {}, currentFixtures = [], timerInterval;
        let hostReady = false, joinerReady = false;

        // SMART LOGO ENGINE: Reliable Initial Fallback + High Res Fetch
        function getLogo(name) {
            // First attempt: High fidelity Logo CDN
            // Second fallback: Initial-based generated vector
            const initial = name.charAt(0);
            return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random&color=fff&bold=true&rounded=true&size=128`;
        }

        function initializeHost() {
            const pin = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(ID_PREFIX + pin);
            peer.on('open', () => {
                document.getElementById('status').innerHTML = `ROOM PIN: <span class="text-white text-3xl block mt-2 font-black">${pin}</span>`;
                isHost = true;
            });
            peer.on('connection', (c) => { conn = c; setupConnection(); });
        }

        function joinGame() {
            const pin = document.getElementById('joinId').value;
            if (pin.length !== 4) return;
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(ID_PREFIX + pin);
                setupConnection();
            });
            peer.on('error', () => alert("Room Not Found"));
        }

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('lobby').classList.add('hidden');
                document.getElementById('game-container').classList.remove('hidden');
                if (isHost) startRound();
            });
            conn.on('data', (data) => {
                if (data.type === 'SYNC') {
                    currentFixtures = data.fixtures;
                    round = data.round;
                    timeLeft = data.timeLeft;
                    resetRound();
                }
                if (data.type === 'RESULTS') processResults(data.results);
                if (data.type === 'READY') {
                    joinerReady = true;
                    if (hostReady) simulateRound();
                }
                if (data.type === 'BAL') {
                    oppBalance = data.bal;
                    updateDashboard();
                }
            });
        }

        function startRound() {
            hostReady = false; joinerReady = false;
            currentFixtures = [];
            Object.keys(CLUBS).forEach(league => {
                const teams = CLUBS[league];
                for(let i=0; i<2; i++) {
                    const h = teams[Math.floor(Math.random()*teams.length)];
                    let a = teams[Math.floor(Math.random()*teams.length)];
                    while(a === h) a = teams[Math.floor(Math.random()*teams.length)];
                    const s1 = Math.random() + 0.5, s2 = Math.random() + 0.5;
                    currentFixtures.push({
                        id: Math.random().toString(36).substr(2, 5),
                        league, h, a,
                        oh: (1/(s1/(s1+s2)) + 0.1).toFixed(2),
                        oa: (1/(s2/(s1+s2)) + 0.1).toFixed(2),
                        s1, s2
                    });
                }
            });
            timeLeft = 90;
            conn.send({ type: 'SYNC', fixtures: currentFixtures, round, timeLeft });
            resetRound();
        }

        function resetRound() {
            myBets = {};
            clearInterval(timerInterval);
            document.getElementById('fixtures-list').scrollTop = 0;
            document.getElementById('lock-bets-btn').disabled = false;
            document.getElementById('lock-bets-btn').innerText = "LOCK PORTFOLIO";
            document.getElementById('lock-bets-btn').className = "flex-grow bg-blue-600 py-4 rounded-2xl font-black uppercase tracking-widest text-xs transition-all";
            renderFixtures('All');
            updateDashboard();
            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('round-timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (isHost) simulateRound();
                }
            }, 1000);
        }

        function renderFixtures(filter) {
            const list = document.getElementById('fixtures-list');
            list.innerHTML = '';
            currentFixtures.filter(f => filter === 'All' || f.league === filter).forEach(f => {
                const card = document.createElement('div');
                card.className = `p-6 rounded-[2rem] card-gradient flex flex-col gap-6`;
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-[9px] font-black uppercase text-blue-500 tracking-widest px-3 py-1 bg-blue-500/10 rounded-full">${f.league}</span>
                    </div>
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex-1 text-center">
                            <img src="${getLogo(f.h)}" class="w-14 h-14 mx-auto mb-3 shadow-xl rounded-full">
                            <div class="text-xs font-black uppercase truncate">${f.h}</div>
                        </div>
                        <div class="text-[10px] font-black text-slate-700 italic px-2">VS</div>
                        <div class="flex-1 text-center">
                            <img src="${getLogo(f.a)}" class="w-14 h-14 mx-auto mb-3 shadow-xl rounded-full">
                            <div class="text-xs font-black uppercase truncate">${f.a}</div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="pick('${f.id}','h')" id="b-${f.id}-h" class="bg-slate-900 border border-slate-800 py-4 rounded-2xl text-[10px] font-black transition-all">LONG ${f.oh}x</button>
                        <button onclick="pick('${f.id}','a')" id="b-${f.id}-a" class="bg-slate-900 border border-slate-800 py-4 rounded-2xl text-[10px] font-black transition-all">LONG ${f.oa}x</button>
                    </div>
                    <div class="relative">
                        <input type="number" inputmode="numeric" placeholder="INVESTMENT STAKE" oninput="stake('${f.id}', this.value)" 
                            class="w-full bg-black border border-white/5 py-4 px-6 rounded-2xl text-center text-xs font-black text-emerald-400 outline-none focus:border-blue-500 transition-colors">
                    </div>
                `;
                list.appendChild(card);
            });
            updateSummary();
        }

        function pick(id, side) {
            if (!myBets[id]) myBets[id] = { stake: 0 };
            myBets[id].side = side;
            document.querySelectorAll(`[id^="b-${id}-"]`).forEach(b => b.classList.remove('active-side'));
            document.getElementById(`b-${id}-${side}`).classList.add('active-side');
            updateSummary();
        }

        function stake(id, val) {
            if (!myBets[id]) myBets[id] = { side: 'h' };
            myBets[id].stake = Math.abs(parseInt(val)) || 0;
            updateSummary();
        }

        function updateSummary() {
            const bets = Object.values(myBets).filter(b => b.stake > 0);
            const total = bets.reduce((a, b) => a + b.stake, 0);
            document.getElementById('active-count').innerText = `${bets.length} MARKETS`;
            document.getElementById('total-stake-display').innerText = `$${total.toLocaleString()}`;
        }

        function submitBets() {
            const total = Object.values(myBets).reduce((a, b) => a + b.stake, 0);
            if (total > myBalance) return alert("Capital Reserves Insufficient!");
            
            const btn = document.getElementById('lock-bets-btn');
            btn.disabled = true;
            btn.innerText = "WAITING FOR RIVAL...";
            btn.className = "flex-grow bg-slate-800 py-4 rounded-2xl font-black uppercase text-xs";

            if (isHost) {
                hostReady = true;
                if (joinerReady) simulateRound();
            } else {
                conn.send({ type: 'READY' });
            }
        }

        function simulateRound() {
            if (!isHost) return;
            const results = currentFixtures.map(f => ({
                id: f.id, winner: (Math.random()*(f.s1+f.s2)) < f.s1 ? 'h' : 'a'
            }));
            conn.send({ type: 'RESULTS', results });
            processResults(results);
        }

        function processResults(results) {
            let pnl = 0, logs = [];
            results.forEach(res => {
                const bet = myBets[res.id];
                const fix = currentFixtures.find(f => f.id === res.id);
                if (bet && bet.stake > 0) {
                    if (bet.side === res.winner) {
                        const win = bet.stake * (res.winner === 'h' ? fix.oh : fix.oa);
                        pnl += (win - bet.stake);
                        logs.push(`<div class="result-entry flex justify-between p-4 bg-emerald-500/5 rounded-2xl border border-emerald-500/10"><div class="text-left"><p class="text-[8px] font-black text-emerald-500 uppercase">Profit</p><p class="text-xs font-bold text-white">${fix.h} vs ${fix.a}</p></div><div class="text-right text-emerald-400 font-black text-sm">+$${Math.floor(win).toLocaleString()}</div></div>`);
                    } else {
                        pnl -= bet.stake;
                        logs.push(`<div class="result-entry flex justify-between p-4 bg-rose-500/5 rounded-2xl border border-rose-500/10"><div class="text-left"><p class="text-[8px] font-black text-rose-500 uppercase">Loss</p><p class="text-xs font-bold text-white">${fix.h} vs ${fix.a}</p></div><div class="text-right text-rose-400 font-black text-sm">-$${bet.stake.toLocaleString()}</div></div>`);
                    }
                }
            });
            myBalance += pnl;
            showResults(pnl, logs);
            conn.send({ type: 'BAL', bal: myBalance });
        }

        function showResults(pnl, logs) {
            const modal = document.getElementById('result-modal');
            const pnlEl = document.getElementById('modal-pnl');
            pnlEl.innerText = (pnl >= 0 ? "+$" : "-$") + Math.abs(Math.floor(pnl)).toLocaleString();
            pnlEl.className = pnl >= 0 ? "text-6xl font-black tracking-tighter text-emerald-400 mb-8" : "text-6xl font-black tracking-tighter text-rose-500 mb-8";
            document.getElementById('modal-logs').innerHTML = logs.length ? logs.join('') : '<p class="text-slate-600 font-black uppercase text-[10px] py-10">No positions taken this month</p>';
            document.getElementById('modal-round-text').innerText = `Fiscal Month ${round} Statement`;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('result-modal').classList.add('hidden');
            if (isHost) {
                round++;
                if (round > 12) return alert("Fiscal Year End. Total Profit: $" + (myBalance - 1000000).toLocaleString());
                startRound();
            }
        }

        function updateDashboard() {
            document.getElementById('balance').innerText = `$${Math.floor(myBalance).toLocaleString()}`;
            document.getElementById('opp-balance').innerText = `$${(oppBalance/1000000).toFixed(1)}M`;
            document.getElementById('round-num').innerText = round;
        }

        function filterLeague(l, btn) {
            document.querySelectorAll('.league-btn').forEach(b => {
                b.className = 'league-btn px-5 py-2 rounded-xl text-[10px] font-black whitespace-nowrap bg-slate-800 text-slate-500 uppercase';
            });
            btn.className = 'league-btn px-5 py-2 rounded-xl text-[10px] font-black whitespace-nowrap bg-blue-600 text-white uppercase';
            renderFixtures(l);
        }
    </script>
</body>
</html>
