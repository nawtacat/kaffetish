<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperBet | Next-Gen Sportsbook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Syncopate:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00ff9d; --accent: #0062ff; }
        
        body { 
            background: #050505;
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-image: radial-gradient(circle at 20% 30%, #1e1b4b 0%, transparent 40%),
                              radial-gradient(circle at 80% 70%, #1e293b 0%, transparent 40%);
        }

        .sports-font { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        .logo-font { font-family: 'Syncopate', sans-serif; letter-spacing: -2px; }

        .neon-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .neon-card:hover {
            border-color: var(--neon);
            box-shadow: 0 0 30px rgba(0, 255, 157, 0.15);
            transform: translateY(-5px);
        }

        .btn-bet {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }

        .btn-bet:hover {
            background: var(--accent);
            border-color: var(--neon);
            color: white;
            box-shadow: 0 0 15px var(--accent);
        }

        .balance-glow {
            text-shadow: 0 0 20px rgba(0, 255, 157, 0.6);
            color: var(--neon);
        }

        .badge-img { filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-16 gap-8">
            <div class="text-center md:text-left">
                <h1 class="text-7xl logo-font font-black italic mb-2 tracking-tighter">
                    PAPER<span class="text-transparent" style="-webkit-text-stroke: 1.5px var(--neon);">BET</span>
                </h1>
                <div class="flex items-center gap-3">
                    <span class="h-[2px] w-12 bg-blue-600"></span>
                    <p class="text-[10px] font-black uppercase tracking-[0.5em] text-gray-500">Tier 1 Exchange 2026</p>
                </div>
            </div>

            <div class="neon-card px-10 py-6 rounded-3xl text-right border-l-8 border-l-[#00ff9d]">
                <p class="text-[10px] font-black uppercase tracking-widest text-gray-500 mb-1">Portfolio Balance</p>
                <div class="flex items-baseline gap-2">
                    <span id="balance" class="text-5xl font-black sports-font balance-glow">1,000</span>
                    <span class="text-xs font-bold text-gray-400">PTS</span>
                </div>
            </div>
        </header>

        <div class="flex gap-4 mb-12 overflow-x-auto pb-4">
            <button onclick="loadLeague('PL')" class="px-8 py-3 rounded-full bg-blue-600 sports-font text-sm tracking-widest">Premier League</button>
            <button onclick="loadLeague('PD')" class="px-8 py-3 rounded-full bg-zinc-900 sports-font text-sm tracking-widest hover:bg-zinc-800">La Liga</button>
            <button onclick="loadLeague('BL1')" class="px-8 py-3 rounded-full bg-zinc-900 sports-font text-sm tracking-widest hover:bg-zinc-800">Bundesliga</button>
            <button onclick="loadLeague('CL')" class="px-8 py-3 rounded-full bg-zinc-900 sports-font text-sm tracking-widest hover:bg-zinc-800">Champions League</button>
        </div>

        <div id="match-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            </div>
    </div>

    <script>
        // NOTE: Get a free key at football-data.org for live updates
        const API_KEY = 'YOUR_FREE_KEY'; 
        let balance = localStorage.getItem('pb_bal') || 1000;

        // Mock Data for 2026 (Loaded if no API key is provided)
        const mockFixtures = [
            { home: "Arsenal", away: "Bournemouth", homeId: 57, awayId: 1044, date: "Sat 11 Apr, 15:30", odds: [1.4, 4.5, 7.2] },
            { home: "Chelsea", away: "Man City", homeId: 61, awayId: 65, date: "Sun 12 Apr, 19:30", odds: [3.1, 3.4, 2.1] },
            { home: "Liverpool", away: "Fulham", homeId: 64, awayId: 63, date: "Sat 11 Apr, 20:30", odds: [1.2, 6.0, 11.5] },
            { home: "Man United", away: "Leeds United", homeId: 66, awayId: 341, date: "Mon 13 Apr, 23:00", odds: [1.8, 3.6, 4.0] }
        ];

        function updateUI() {
            document.getElementById('balance').innerText = Number(balance).toLocaleString();
            localStorage.setItem('pb_bal', balance);
        }

        async function loadLeague(code) {
            const grid = document.getElementById('match-grid');
            grid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-600 sports-font animate-pulse">Syncing Global Data...</div>';

            // If you have an API key, we fetch real data. Otherwise, we show the high-quality Mock PL games.
            if (API_KEY !== 'YOUR_FREE_KEY') {
                try {
                    const response = await fetch(`https://api.football-data.org/v4/competitions/${code}/matches?status=SCHEDULED`, {
                        headers: { 'X-Auth-Token': API_KEY }
                    });
                    const data = await response.json();
                    renderMatches(data.matches);
                    return;
                } catch (e) { console.log("API Error, falling back to mock data."); }
            }
            
            // Render High Quality Mock Data for now
            setTimeout(() => renderMatches(mockFixtures), 800);
        }

        function renderMatches(matches) {
            const grid = document.getElementById('match-grid');
            grid.innerHTML = '';

            matches.forEach((m, idx) => {
                const card = document.createElement('div');
                card.className = 'neon-card p-8 rounded-[2.5rem] flex flex-col justify-between overflow-hidden relative';
                
                // Using a reliable crest CDN
                const homeBadge = `https://crests.football-data.org/${m.homeId}.png`;
                const awayBadge = `https://crests.football-data.org/${m.awayId}.png`;

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-10">
                        <span class="text-[10px] font-black tracking-widest text-blue-500 uppercase">Live Market • PL</span>
                        <span class="text-[11px] sports-font text-gray-500 bg-white/5 px-4 py-1 rounded-full border border-white/5">${m.date || 'Upcoming'}</span>
                    </div>

                    <div class="flex justify-between items-center mb-10 gap-4">
                        <div class="flex-1 flex flex-col items-center">
                            <img src="${homeBadge}" class="w-20 h-20 mb-4 badge-img" onerror="this.src='https://placehold.co/100x100/111/fff?text=${m.home[0]}'">
                            <span class="sports-font text-lg text-center leading-tight">${m.home}</span>
                        </div>
                        
                        <div class="flex flex-col items-center">
                            <div class="text-2xl font-black italic text-zinc-800">VS</div>
                        </div>

                        <div class="flex-1 flex flex-col items-center">
                            <img src="${awayBadge}" class="w-20 h-20 mb-4 badge-img" onerror="this.src='https://placehold.co/100x100/111/fff?text=${m.away[0]}'">
                            <span class="sports-font text-lg text-center leading-tight">${m.away}</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <button onclick="bet('${m.home}', 1)" class="btn-bet py-4 rounded-2xl sports-font text-xs tracking-tighter">
                            1 <span class="block text-[10px] text-blue-400">${m.odds ? m.odds[0] : '1.85'}</span>
                        </button>
                        <button onclick="bet('Draw', 1)" class="btn-bet py-4 rounded-2xl sports-font text-xs tracking-tighter">
                            X <span class="block text-[10px] text-gray-500">${m.odds ? m.odds[1] : '3.40'}</span>
                        </button>
                        <button onclick="bet('${m.away}', 1)" class="btn-bet py-4 rounded-2xl sports-font text-xs tracking-tighter">
                            2 <span class="block text-[10px] text-blue-400">${m.odds ? m.odds[2] : '4.20'}</span>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function bet(team, amount) {
            if (balance < 100) return alert("INSUFFICIENT FUNDS");
            balance -= 100;
            updateUI();
            alert(`TICKET LOCKED: 100 PTS ON ${team.toUpperCase()}`);
        }

        updateUI();
        loadLeague('PL');
    </script>
</body>
</html>
