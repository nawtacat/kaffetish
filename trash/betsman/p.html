<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERBET | UNLIMITED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Syncopate:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --neon: #39ff14; --neon-blue: #00f2ff; }
        body { 
            background: #020617; color: white; font-family: 'Inter', sans-serif;
            background-image: linear-gradient(to bottom, #020617, #0f172a);
            min-height: 100vh;
        }
        .header-font { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: -1px; }
        .logo-font { font-family: 'Syncopate', sans-serif; }
        
        .neon-border { border: 2px solid rgba(57, 255, 20, 0.1); transition: 0.3s; }
        .neon-border:hover { border-color: var(--neon); box-shadow: 0 0 20px rgba(57, 255, 20, 0.2); }
        
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); }
        
        .bet-btn { 
            background: #1e293b; border: 1px solid #334155; 
            transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bet-btn:hover { background: #334155; transform: scale(1.05); border-color: var(--neon-blue); }
        .bet-btn:active { transform: scale(0.95); }

        .balance-card {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            border-bottom: 4px solid var(--neon);
        }

        /* Custom Scrollbar for the 'gamer' look */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--neon); border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="auth-gate" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-xl">
        <div class="w-full max-w-md p-12 glass rounded-[3rem] border border-white/10 text-center">
            <h1 class="logo-font text-4xl mb-2 italic tracking-tighter text-white">PAPER<span class="text-transparent" style="-webkit-text-stroke: 1px var(--neon);">BET</span></h1>
            <p class="text-[10px] text-gray-500 font-black uppercase tracking-[0.5em] mb-10">Terminal v3.0 // 2026</p>
            
            <input type="text" id="user-input" placeholder="USERNAME" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-4 outline-none focus:border-cyan-500 text-center font-bold">
            <input type="password" id="pass-input" placeholder="PASSWORD" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-8 outline-none focus:border-cyan-500 text-center font-bold">
            
            <div class="grid grid-cols-2 gap-4">
                <button onclick="auth('login')" class="bg-white text-black p-4 rounded-2xl font-black uppercase text-xs hover:bg-cyan-500 transition">Enter</button>
                <button onclick="auth('signup')" class="border border-white/20 p-4 rounded-2xl font-black uppercase text-xs hover:bg-white/10 transition">Create</button>
            </div>
        </div>
    </div>

    <div id="app-main" class="max-w-7xl mx-auto hidden">
        <header class="flex flex-col lg:flex-row justify-between items-center mb-16 gap-8">
            <div class="relative">
                <h1 class="text-7xl logo-font font-black italic tracking-tighter">PAPER<span class="text-transparent" style="-webkit-text-stroke: 1.5px var(--neon-blue);">BET</span></h1>
                <div class="flex items-center gap-2 mt-2">
                    <span class="h-1 w-8 bg-cyan-500"></span>
                    <span class="text-[10px] font-black text-cyan-500 uppercase tracking-widest">Live Exchange Active</span>
                </div>
            </div>

            <div class="balance-card px-12 py-8 rounded-[2rem] text-center lg:text-right min-w-[280px]">
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Available Points</p>
                <div class="flex items-baseline justify-center lg:justify-end gap-3">
                    <span id="balance-display" class="text-6xl header-font text-white leading-none">0</span>
                    <span class="text-xs font-black text-green-400">PTS</span>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 xl:grid-cols-4 gap-8">
            <div class="xl:col-span-3">
                <div class="flex gap-4 mb-8 overflow-x-auto pb-4 no-scrollbar">
                    <button onclick="fetchGames('PL')" class="px-8 py-3 bg-cyan-600 rounded-full header-font text-sm whitespace-nowrap">Premier League</button>
                    <button onclick="fetchGames('CL')" class="px-8 py-3 bg-zinc-900 rounded-full header-font text-sm whitespace-nowrap hover:bg-zinc-800">Champions League</button>
                    <button onclick="fetchGames('PD')" class="px-8 py-3 bg-zinc-900 rounded-full header-font text-sm whitespace-nowrap hover:bg-zinc-800">La Liga</button>
                </div>
                
                <div id="match-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    </div>
            </div>

            <div class="xl:col-span-1">
                <div class="glass p-8 rounded-[2.5rem] border border-white/5">
                    <h3 class="header-font text-xl mb-6 flex items-center gap-2">
                        <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                        Recent Activity
                    </h3>
                    <div id="bet-history" class="space-y-4">
                        <p class="text-gray-500 text-xs italic">No active tickets...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // !!! ACTION REQUIRED !!!
        // Paste your Firebase Config object here from the console
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_ID.firebaseapp.com",
            projectId: "YOUR_ID",
            storageBucket: "YOUR_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const authModule = getAuth(app);
        const db = getFirestore(app);

        const FOOTBALL_KEY = 'e8a614b409df47d6a1ed615bc79787c7';
        let userProfile = null;

        // AUTH HANDLER
        window.auth = async (type) => {
            const email = `${document.getElementById('user-input').value}@paperbet.com`;
            const pass = document.getElementById('pass-input').value;
            
            try {
                if(type === 'signup') {
                    const res = await createUserWithEmailAndPassword(authModule, email, pass);
                    await setDoc(doc(db, "users", res.user.uid), {
                        username: document.getElementById('user-input').value,
                        balance: 1000,
                        bets: []
                    });
                } else {
                    await signInWithEmailAndPassword(authModule, email, pass);
                }
            } catch (e) { alert(e.message); }
        };

        // SESSION OBSERVER
        onAuthStateChanged(authModule, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "users", user.uid));
                userProfile = { id: user.uid, ...snap.data() };
                document.getElementById('auth-gate').style.display = 'none';
                document.getElementById('app-main').style.display = 'block';
                syncUI();
                fetchGames('PL');
            }
        });

        // UI SYNC
        function syncUI() {
            document.getElementById('balance-display').innerText = userProfile.balance.toLocaleString();
            const history = document.getElementById('bet-history');
            history.innerHTML = userProfile.bets.slice(-5).reverse().map(b => `
                <div class="bg-white/5 p-4 rounded-xl border-l-2 border-cyan-500">
                    <p class="text-[10px] text-gray-400 font-bold uppercase">${b.team}</p>
                    <p class="header-font text-sm">STAKE: ${b.amount} PTS</p>
                </div>
            `).join('') || '<p class="text-gray-500 text-xs">No bets yet.</p>';
        }

        // FETCH GAMES
        window.fetchGames = async (league) => {
            const grid = document.getElementById('match-grid');
            grid.innerHTML = '<div class="col-span-full text-center py-20 text-cyan-400 header-font animate-pulse">Establishing Connection...</div>';
            
            try {
                const res = await fetch(`https://api.football-data.org/v4/competitions/${league}/matches?status=SCHEDULED`, {
                    headers: { 'X-Auth-Token': FOOTBALL_KEY }
                });
                const data = await res.json();
                
                grid.innerHTML = '';
                data.matches.slice(0, 10).forEach(m => {
                    const el = document.createElement('div');
                    el.className = 'glass p-8 rounded-[2.5rem] neon-border';
                    el.innerHTML = `
                        <div class="flex justify-between items-center mb-8">
                            <span class="text-[10px] font-black text-zinc-500 uppercase tracking-widest">${league} • LIVE MARKET</span>
                            <span class="text-[10px] font-black text-cyan-500 uppercase">${new Date(m.utcDate).toDateString()}</span>
                        </div>
                        <div class="flex justify-between items-center mb-10 text-center">
                            <div class="flex-1">
                                <img src="https://crests.football-data.org/${m.homeTeam.id}.png" class="h-16 mx-auto mb-3" onerror="this.src='https://placehold.co/100x100/111/fff?text=T1'">
                                <p class="header-font text-sm">${m.homeTeam.shortName}</p>
                            </div>
                            <div class="px-4 header-font text-zinc-800 text-2xl italic">VS</div>
                            <div class="flex-1">
                                <img src="https://crests.football-data.org/${m.awayTeam.id}.png" class="h-16 mx-auto mb-3" onerror="this.src='https://placehold.co/100x100/111/fff?text=T2'">
                                <p class="header-font text-sm">${m.awayTeam.shortName}</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="window.placeBet('${m.homeTeam.shortName}')" class="bet-btn p-4 rounded-xl header-font text-[10px]">HOME</button>
                            <button onclick="window.placeBet('Draw')" class="bet-btn p-4 rounded-xl header-font text-[10px]">DRAW</button>
                            <button onclick="window.placeBet('${m.awayTeam.shortName}')" class="bet-btn p-4 rounded-xl header-font text-[10px]">AWAY</button>
                        </div>
                    `;
                    grid.appendChild(el);
                });
            } catch (err) { grid.innerHTML = "API Limit reached. Wait 60 seconds."; }
        }

        // PLACE BET
        window.placeBet = async (team) => {
            if (userProfile.balance < 100) return alert("Broke! Get some points first.");
            
            const newBalance = userProfile.balance - 100;
            const newBet = { team, amount: 100, date: new Date().toISOString() };
            
            await updateDoc(doc(db, "users", userProfile.id), {
                balance: newBalance,
                bets: arrayUnion(newBet)
            });
            
            userProfile.balance = newBalance;
            userProfile.bets.push(newBet);
            syncUI();
            alert(`LOCKED: 100 PTS on ${team}`);
        }
    </script>
</body>
</html>
