<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperBet | Ultra-Premium Sportsbook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
        }

        body { 
            background: radial-gradient(circle at 50% 0%, #1e1b4b, #020617);
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header-font { font-family: 'Syncopate', sans-serif; }
        .mono { font-family: 'JetBrains+Mono', monospace; }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .match-card {
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-left: 4px solid transparent;
        }

        .match-card:hover {
            transform: scale(1.02);
            border-left: 4px solid var(--neon-blue);
            background: rgba(30, 41, 59, 0.8);
        }

        .neon-glow {
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        .gradient-border {
            background: linear-gradient(to right, var(--neon-blue), var(--neon-purple));
            height: 2px;
            width: 100%;
        }

        .league-btn.active {
            background: linear-gradient(45deg, #2563eb, #7c3aed);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
            border-color: rgba(255,255,255,0.2);
        }

        .badge-shadow { filter: drop-shadow(0 0 8px rgba(255,255,255,0.2)); }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-end mb-16 gap-8">
            <div class="relative">
                <div class="absolute -top-4 -left-4 w-20 h-20 bg-blue-500/20 blur-3xl rounded-full"></div>
                <h1 class="text-6xl header-font tracking-tighter italic uppercase text-white mb-2">
                    PAPER<span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">BET</span>
                </h1>
                <div class="flex items-center gap-2">
                    <span class="h-1 w-12 bg-cyan-500 rounded-full"></span>
                    <p class="text-xs font-black uppercase tracking-[0.3em] text-cyan-500/80">Elite Sports Exchange</p>
                </div>
            </div>

            <div class="glass-card px-10 py-6 rounded-3xl flex flex-col items-end border-r-4 border-purple-500">
                <span class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-1">Available Liquidity</span>
                <div class="flex items-baseline gap-2">
                    <span id="balance" class="text-4xl mono font-bold neon-glow">1,000</span>
                    <span class="text-purple-400 font-black text-sm uppercase">PTS</span>
                </div>
            </div>
        </header>

        <div class="flex gap-4 mb-12 overflow-x-auto pb-4 no-scrollbar">
            <button onclick="changeLeague(this, '4328')" class="league-btn active whitespace-nowrap bg-slate-900 border border-slate-800 px-8 py-4 rounded-2xl font-black text-xs uppercase tracking-widest transition-all">🇬🇧 Premier League</button>
            <button onclick="changeLeague(this, '4335')" class="league-btn whitespace-nowrap bg-slate-900 border border-slate-800 px-8 py-4 rounded-2xl font-black text-xs uppercase tracking-widest transition-all">🇪🇸 La Liga</button>
            <button onclick="changeLeague(this, '4331')" class="league-btn whitespace-nowrap bg-slate-900 border border-slate-800 px-8 py-4 rounded-2xl font-black text-xs uppercase tracking-widest transition-all">🇩🇪 Bundesliga</button>
            <button onclick="changeLeague(this, '4332')" class="league-btn whitespace-nowrap bg-slate-900 border border-slate-800 px-8 py-4 rounded-2xl font-black text-xs uppercase tracking-widest transition-all">🇮🇹 Serie A</button>
            <button onclick="changeLeague(this, '4480')" class="league-btn whitespace-nowrap bg-slate-900 border border-slate-800 px-8 py-4 rounded-2xl font-black text-xs uppercase tracking-widest transition-all">🏆 Champions League</button>
        </div>

        <div id="match-grid" class="grid grid-cols-1 xl:grid-cols-2 gap-8">
            </div>
    </div>

    <script>
        const API_KEY = '3';
        let balance = localStorage.getItem('paperBetBalance') ? parseInt(localStorage.getItem('paperBetBalance')) : 1000;
        
        function updateDisplay() {
            document.getElementById('balance').innerText = balance.toLocaleString();
            localStorage.setItem('paperBetBalance', balance);
        }

        function changeLeague(btn, id) {
            document.querySelectorAll('.league-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            fetchMatches(id);
        }

        async function fetchMatches(leagueId) {
            const grid = document.getElementById('match-grid');
            grid.innerHTML = `
                <div class="col-span-full py-32 text-center">
                    <div class="inline-block animate-spin rounded-full h-16 w-16 border-t-4 border-cyan-500 mb-6"></div>
                    <p class="header-font text-sm tracking-widest text-cyan-500 animate-pulse">Fetching Real-Time Odds...</p>
                </div>`;

            try {
                // TheSportsDB: 4328 is PL, 4335 La Liga, etc.
                const response = await fetch(`https://www.thesportsdb.com/api/v1/json/${API_KEY}/eventsnextleague.php?id=${leagueId}`);
                const data = await response.json();

                if (!data.events) {
                    grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10 font-bold uppercase tracking-widest">Off-season or No upcoming fixtures found.</p>`;
                    return;
                }

                grid.innerHTML = '';
                data.events.forEach(event => {
                    const date = new Date(event.strTimestamp).toLocaleDateString('en-GB', { 
                        weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' 
                    });
                    
                    const card = document.createElement('div');
                    card.className = 'match-card glass-card p-8 rounded-[2rem] flex flex-col justify-between overflow-hidden';
                    
                    // We use the Team Badge API from TheSportsDB
                    // tiny badges: /images/media/team/badge/tiny/ID.png
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-10">
                            <div class="flex items-center gap-3">
                                <span class="w-2 h-2 rounded-full bg-green-500 animate-ping"></span>
                                <span class="text-[10px] font-black uppercase tracking-[0.2em] text-gray-400">${event.strLeague}</span>
                            </div>
                            <span class="mono text-[11px] text-cyan-400 bg-cyan-950/30 px-3 py-1 rounded-lg border border-cyan-500/20">${date}</span>
                        </div>
                        
                        <div class="flex justify-between items-center mb-12 relative">
                            <div class="flex flex-col items-center flex-1">
                                <div class="w-24 h-24 mb-4 flex items-center justify-center p-2 rounded-2xl bg-white/5 border border-white/10">
                                    <img src="https://www.thesportsdb.com/images/media/team/badge/small/${event.idHomeTeam}.png" 
                                         class="w-full h-full object-contain badge-shadow" onerror="this.src='https://via.placeholder.com/100?text=TEAM'">
                                </div>
                                <span class="header-font text-xs text-center leading-tight tracking-tighter">${event.strHomeTeam}</span>
                            </div>

                            <div class="flex flex-col items-center px-4">
                                <div class="text-xs font-black text-slate-700 italic mb-2 tracking-tighter">VERSUS</div>
                                <div class="h-12 w-[1px] bg-gradient-to-b from-transparent via-slate-700 to-transparent"></div>
                            </div>

                            <div class="flex flex-col items-center flex-1">
                                <div class="w-24 h-24 mb-4 flex items-center justify-center p-2 rounded-2xl bg-white/5 border border-white/10">
                                    <img src="https://www.thesportsdb.com/images/media/team/badge/small/${event.idAwayTeam}.png" 
                                         class="w-full h-full object-contain badge-shadow" onerror="this.src='https://via.placeholder.com/100?text=TEAM'">
                                </div>
                                <span class="header-font text-xs text-center leading-tight tracking-tighter">${event.strAwayTeam}</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-4">
                            <button onclick="placeBet('${event.strHomeTeam}')" class="group relative bg-slate-800/50 hover:bg-cyan-600 p-4 rounded-2xl transition-all duration-300">
                                <span class="relative z-10 text-[10px] font-black uppercase tracking-widest group-hover:text-white text-gray-400">Home</span>
                                <div class="absolute inset-0 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity bg-gradient-to-r from-cyan-600 to-blue-600"></div>
                            </button>
                            <button onclick="placeBet('Draw')" class="bg-slate-800/50 hover:bg-slate-700 p-4 rounded-2xl font-black text-[10px] uppercase tracking-widest transition-all text-gray-400">Draw</button>
                            <button onclick="placeBet('${event.strAwayTeam}')" class="group relative bg-slate-800/50 hover:bg-purple-600 p-4 rounded-2xl transition-all duration-300">
                                <span class="relative z-10 text-[10px] font-black uppercase tracking-widest group-hover:text-white text-gray-400">Away</span>
                                <div class="absolute inset-0 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity bg-gradient-to-r from-purple-600 to-pink-600"></div>
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                grid.innerHTML = `<p class="col-span-full text-center text-red-400 font-mono">CRITICAL_ERROR: API_LIMIT_EXCEEDED</p>`;
            }
        }

        function placeBet(team) {
            const stake = 100;
            if (balance < stake) {
                alert("🚫 INSUFFICIENT LIQUIDITY");
                return;
            }
            balance -= stake;
            updateDisplay();
            
            // Visual feedback instead of simple alert
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = "<span class='text-white animate-pulse'>LOCKED</span>";
            setTimeout(() => { btn.innerHTML = originalText; }, 2000);
        }

        // Initialize
        updateDisplay();
        fetchMatches('4328');
    </script>
</body>
</html>
