<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperBet | Premium Sports Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background: radial-gradient(circle at top left, #1e293b, #0f172a); 
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            border: 1px solid rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }
        .gradient-text {
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
            <div>
                <h1 class="text-5xl font-black tracking-tighter italic uppercase gradient-text">PaperBet</h1>
                <p class="text-gray-400 font-medium">Real Fixtures. Virtual Stakes.</p>
            </div>
            <div class="glass-card px-8 py-4 rounded-2xl flex items-center gap-4 shadow-2xl">
                <span class="text-gray-400 font-bold uppercase text-xs tracking-widest">Balance</span>
                <span id="balance" class="text-3xl font-black text-green-400 font-mono">1,000</span>
                <span class="text-green-500 font-bold">PTS</span>
            </div>
        </header>

        <div class="flex gap-3 mb-10 overflow-x-auto pb-4 no-scrollbar">
            <button onclick="fetchMatches('4328')" class="league-btn bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-xl font-bold flex-shrink-0 transition shadow-lg">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League</button>
            <button onclick="fetchMatches('4335')" class="league-btn bg-slate-800 hover:bg-blue-600 px-6 py-3 rounded-xl font-bold flex-shrink-0 transition">🇪🇸 La Liga</button>
            <button onclick="fetchMatches('4331')" class="league-btn bg-slate-800 hover:bg-blue-600 px-6 py-3 rounded-xl font-bold flex-shrink-0 transition">🇩🇪 Bundesliga</button>
            <button onclick="fetchMatches('4480')" class="league-btn bg-slate-800 hover:bg-blue-600 px-6 py-3 rounded-xl font-bold flex-shrink-0 transition">🏆 Champions League</button>
        </div>

        <div id="match-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            </div>
    </div>

    <script>
        // Use '3' as it's the official public test key for TheSportsDB
        const API_KEY = '3';
        let balance = localStorage.getItem('paperBetBalance') ? parseInt(localStorage.getItem('paperBetBalance')) : 1000;
        
        function updateDisplay() {
            document.getElementById('balance').innerText = balance.toLocaleString();
            localStorage.setItem('paperBetBalance', balance);
        }

        async function fetchMatches(leagueId) {
            const grid = document.getElementById('match-grid');
            grid.innerHTML = `
                <div class="col-span-full py-20 text-center">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mb-4"></div>
                    <p class="text-xl font-bold text-gray-500">Syncing with Stadiums...</p>
                </div>`;

            try {
                // Fetch next 15 events for the league
                const response = await fetch(`https://www.thesportsdb.com/api/v1/json/${API_KEY}/eventsnextleague.php?id=${leagueId}`);
                const data = await response.json();

                if (!data.events) {
                    grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">No upcoming fixtures found for this league.</p>`;
                    return;
                }

                grid.innerHTML = '';
                data.events.forEach(event => {
                    const date = new Date(event.strTimestamp).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
                    
                    const card = document.createElement('div');
                    card.className = 'glass-card p-6 rounded-3xl flex flex-col justify-between shadow-xl';
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-6">
                            <span class="bg-blue-900/50 text-blue-300 text-xs font-black px-3 py-1 rounded-full uppercase tracking-tighter">${event.strLeague}</span>
                            <span class="text-gray-400 text-xs font-bold">${date}</span>
                        </div>
                        
                        <div class="flex justify-between items-center mb-8 gap-4">
                            <div class="flex flex-col items-center flex-1 text-center">
                                <img src="https://www.thesportsdb.com/images/media/team/badge/tiny/${event.idHomeTeam}.png" 
                                     onerror="this.src='https://via.placeholder.com/50?text=?'" class="w-16 h-16 mb-3 drop-shadow-2xl">
                                <span class="font-black text-sm uppercase leading-tight">${event.strHomeTeam}</span>
                            </div>

                            <div class="text-2xl font-black text-gray-600 italic">VS</div>

                            <div class="flex flex-col items-center flex-1 text-center">
                                <img src="https://www.thesportsdb.com/images/media/team/badge/tiny/${event.idAwayTeam}.png" 
                                     onerror="this.src='https://via.placeholder.com/50?text=?'" class="w-16 h-16 mb-3 drop-shadow-2xl">
                                <span class="font-black text-sm uppercase leading-tight">${event.strAwayTeam}</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-3">
                            <button onclick="placeBet('${event.strHomeTeam}')" class="bg-slate-700/50 hover:bg-green-600 p-3 rounded-xl font-bold transition text-xs uppercase tracking-widest">Home</button>
                            <button onclick="placeBet('Draw')" class="bg-slate-700/50 hover:bg-gray-600 p-3 rounded-xl font-bold transition text-xs uppercase tracking-widest">Draw</button>
                            <button onclick="placeBet('${event.strAwayTeam}')" class="bg-slate-700/50 hover:bg-blue-600 p-3 rounded-xl font-bold transition text-xs uppercase tracking-widest">Away</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                grid.innerHTML = `<p class="col-span-full text-center text-red-400">Error loading data. The public API key may be rate-limited.</p>`;
            }
        }

        function placeBet(team) {
            const stake = 100;
            if (balance < stake) {
                alert("Insufficient Game Points!");
                return;
            }
            balance -= stake;
            updateDisplay();
            alert(`Bet Confirmed! 100 PTS on ${team}.`);
        }

        // Initialize
        updateDisplay();
        fetchMatches('4328'); // Load PL by default
    </script>
</body>
</html>
